name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/dist/**"
      - "Caddyfile"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue Frontend en Servidor (Self-Hosted Runner)
    runs-on: self-hosted

    steps:
      - name: Actualizar frontend en el servidor
        run: |
          cd /home/serverportable/Documentos/Prestamos/sistema-prestamos-modo-frances
          git stash -u || true
          git fetch origin main
          git reset --hard origin/main
          docker compose restart caddy
          echo "Frontend actualizado y Caddy reiniciado exitosamente."
