name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/dist/**"
      - "Caddyfile"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue Frontend en Servidor (Self-Hosted Runner)
    runs-on: self-hosted

    steps:
      - name: Actualizar frontend en el servidor
        run: |
          set -euo pipefail
          cd /home/serverportable/Documentos/Prestamos/sistema-prestamos-modo-frances
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "El checkout del servidor tiene cambios locales; se conserva sin reemplazar."
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          docker compose restart caddy
          echo "Frontend actualizado y Caddy reiniciado exitosamente."
