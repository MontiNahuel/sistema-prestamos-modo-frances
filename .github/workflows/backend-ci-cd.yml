name: Backend CI/CD - Test, Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

jobs:
  test:
    name: Pruebas Unitarias Backend (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del sistema para ODBC
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar pruebas de algoritmos y cálculos financieros
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_sistema_frances.py tests/test_variantes_motores.py

  build-and-deploy:
    name: Build Docker & Deploy Backend
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar compilación de la imagen Docker de Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: sistema-prestamos-backend:latest

      - name: Despliegue en Servidor vía SSH (Zero Downtime para DB)
        # Se ejecuta solo si se configuran los secretos del servidor en GitHub
        if: "${{ secrets.SERVER_HOST != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PROJECT_PATH || '/opt/sistema-prestamos' }}
            git pull origin main
            # Reconstruir solo el backend y levantarlo sin reiniciar la base de datos (--no-deps)
            docker compose build backend
            docker compose up -d --no-deps backend
            docker compose ps
