name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue Backend en Servidor (Self-Hosted Runner)
    runs-on: self-hosted

    steps:
      - name: Actualizar código y reiniciar Backend
        run: |
          cd /home/serverportable/Documentos/Prestamos/sistema-prestamos-modo-frances
          git pull origin main
          docker compose build backend
          docker compose up -d --no-deps backend
          docker compose ps
